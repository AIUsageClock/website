# Builds the site and publishes it to GitHub Pages (custom domain: https://aiusageclock.com/).
# The custom domain is set in the repository's Pages settings, not here: with this
# build_type=workflow setup GitHub ignores a CNAME file in the artifact.
#
# Every action is pinned to a full commit SHA; the comment after it is the release tag.
# To update one: look up the tag's commit with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# (if "object.type" is "tag" rather than "commit", resolve it once more with
#   gh api repos/<owner>/<repo>/git/tags/<object.sha>)
# and replace the SHA and the comment together.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs (see the job-level permissions below).
permissions: {}

# One deployment at a time; a running deployment is finished, not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages only reads the Pages settings (GET /repos/{owner}/{repo}/pages)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test the HTML rules for the dictionary strings
        run: npm run test:html

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15 # longer than deploy-pages' own 10-minute timeout, so its clearer message shows first
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
